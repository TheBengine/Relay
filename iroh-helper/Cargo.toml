[package]
name = "relay-iroh"
version = "0.10.0"
edition = "2021"
publish = false
license = "PolyForm-Perimeter-1.0.0"
description = "Relay's account-free route: carries chat and voice over iroh. A separate helper, like relay-network."

# Its own workspace and lockfile: the main Relay build and its pinned
# dependencies stay exactly as they are.
[workspace]

[lib]
name = "relay_iroh"
path = "src/lib.rs"

[[bin]]
name = "relay-iroh"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.103"
base64 = "=0.22.1"
bytes = "=1.11.1"
getrandom = "=0.4.3"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "server", "client"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio", "server", "client", "client-legacy", "http1"] }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.11.1"
subtle = "=2.6.1"
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync", "signal"] }

[dev-dependencies]
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "handshake"] }
futures-util = "=0.3.31"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
