<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
<title id="title">Choose where your community lives</title><desc id="desc">Friends connect to a community server on your Windows PC or another machine you choose. You control community data and backups. The host must stay online; account services and connection relays can still be involved.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m2 1 6 4-6 4" fill="none" stroke="#9baaff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1220"/><stop offset="1" stop-color="#17233c"/></linearGradient></defs>
<rect x=".5" y=".5" width="1199" height="709" rx="24" fill="url(#backdrop)" stroke="#30405e"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="56" y="49" font-size="17" fill="#a4e9d2" font-weight="600" letter-spacing="1.7">01 / OWN THE BACKEND</text><text x="56" y="112" font-size="44" fill="#f4f6ff" font-weight="650">Choose where your community lives.</text><text x="56" y="157" font-size="24" fill="#b9c7df" font-weight="400">Run the community server on hardware you choose.</text><rect x="56" y="222" width="246" height="88" rx="18" fill="#151f33" stroke="#30405e"/><g transform="translate(80 246) scale(1)" stroke="#9baaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="16" cy="10" r="6"/><path d="M4 30v-3a12 12 0 0 1 24 0v3"/></g><text x="134" y="276" font-size="27" fill="#f4f6ff" font-weight="600">You</text><rect x="56" y="338" width="246" height="88" rx="18" fill="#151f33" stroke="#30405e"/><g transform="translate(80 362) scale(1)" stroke="#9baaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="16" cy="10" r="6"/><path d="M4 30v-3a12 12 0 0 1 24 0v3"/></g><text x="134" y="392" font-size="27" fill="#f4f6ff" font-weight="600">A friend</text><rect x="56" y="454" width="246" height="88" rx="18" fill="#151f33" stroke="#30405e"/><g transform="translate(80 478) scale(1)" stroke="#9baaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="16" cy="10" r="6"/><path d="M4 30v-3a12 12 0 0 1 24 0v3"/></g><text x="134" y="508" font-size="27" fill="#f4f6ff" font-weight="600">A friend</text><path d="M302 266H350Q366 266 366 282V382M302 382H366M302 498H350Q366 498 366 482V382M366 382H430" fill="none" stroke="#9baaff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="430" y="222" width="390" height="320" rx="24" fill="#1a2945" stroke="#51659e"/><text x="462" y="279" font-size="30" fill="#f4f6ff" font-weight="650">Your community</text><g transform="translate(748 248) scale(1)" stroke="#a4e9d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="2" y="2" width="28" height="11" rx="3"/><rect x="2" y="19" width="28" height="11" rx="3"/><path d="M7 7.5h1m-1 17h1m7-17h10m-10 17h10"/></g><path d="M462 301H788" fill="none" stroke="#30405e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="458" y="328" width="334" height="62" rx="12" fill="#111c30" stroke="#30405e"/><g transform="translate(478 343) scale(0.85)" stroke="#9baaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="1" y="3" width="30" height="21" rx="3"/><path d="M16 24v6m-8 0h16"/></g><text x="521" y="368" font-size="23" fill="#f4f6ff" font-weight="500">Your Windows PC</text><rect x="458" y="414" width="334" height="62" rx="12" fill="#111c30" stroke="#30405e"/><g transform="translate(478 429) scale(0.85)" stroke="#9baaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="2" y="2" width="28" height="11" rx="3"/><rect x="2" y="19" width="28" height="11" rx="3"/><path d="M7 7.5h1m-1 17h1m7-17h10m-10 17h10"/></g><text x="521" y="454" font-size="23" fill="#f4f6ff" font-weight="500">Or a separate server</text><text x="462" y="515" font-size="21" fill="#b9c7df" font-weight="400">Channels · Files · Permissions</text><path d="M820 382H900" fill="none" stroke="#a4e9d2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="900" y="306" width="244" height="167" rx="20" fill="#151f33" stroke="#30405e"/><g transform="translate(924 328) scale(0.85)" stroke="#a4e9d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M2 9V5a3 3 0 0 1 3-3h8l5 5h9a3 3 0 0 1 3 3v17a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V9Z"/></g><text x="924" y="404" font-size="27" fill="#f4f6ff" font-weight="600">Your backups</text><text x="924" y="442" font-size="21" fill="#b9c7df" font-weight="400">Your storage choice</text><text x="56" y="616" font-size="25" fill="#f4f6ff" font-weight="600">Keep the host online while your community is in use.</text><text x="56" y="659" font-size="23" fill="#b9c7df" font-weight="400">Account services and connection relays may still be involved.</text></g></svg>
