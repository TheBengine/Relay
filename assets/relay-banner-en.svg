<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">Relay — Your friends. Your server.</title><desc id="desc">Native Windows chat, voice and screen sharing, on a community server you control. Self-hosting and recommended end-to-end encryption. Illustration, not a live screenshot.</desc>
