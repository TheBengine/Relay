<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1120" viewBox="0 0 640 1120" role="img" aria-labelledby="title desc">
<title id="title">Your community. Your hardware.</title><desc id="desc">Friends connect to a community server on your Windows PC or another machine you choose. You control community data and backups. The host must stay online; account services and connection relays can still be involved.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m2 1 6 4-6 4" fill="none" stroke="#9baaff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1220"/><stop offset="1" stop-color="#17233c"/></linearGradient></defs>
<rect x=".5" y=".5" width="639" height="1119" rx="24" fill="url(#backdrop)" stroke="#30405e"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="48" font-size="19" fill="#a4e9d2" font-weight="600" letter-spacing="1.3">01 / OWN THE BACKEND</text><text x="40" y="108" font-size="42" fill="#f4f6ff" font-weight="650">Your community.</text><text x="40" y="162" font-size="42" fill="#f4f6ff" font-weight="650">Your hardware.</text><text x="40" y="222" font-size="27" fill="#b9c7df" font-weight="400">Choose where the community</text><text x="40" y="259" font-size="27" fill="#b9c7df" font-weight="400">server and its backups live.</text><g transform="translate(114 319) scale(1.25)" stroke="#9baaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="16" cy="10" r="6"/><path d="M4 30v-3a12 12 0 0 1 24 0v3"/></g><text x="134" y="401" font-size="27" fill="#f4f6ff" font-weight="600" text-anchor="middle">You</text><g transform="translate(434 319) scale(1.25)" stroke="#9baaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="16" cy="10" r="6"/><path d="M4 30v-3a12 12 0 0 1 24 0v3"/></g><text x="454" y="401" font-size="27" fill="#f4f6ff" font-weight="600" text-anchor="middle">Friends</text><path d="M134 421V449H270V472" fill="none" stroke="#9baaff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M454 421V449H370V472" fill="none" stroke="#9baaff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="474" width="560" height="284" rx="22" fill="#1a2945" stroke="#51659e"/><text x="70" y="528" font-size="31" fill="#f4f6ff" font-weight="650">Your community server</text><rect x="64" y="558" width="512" height="68" rx="12" fill="#111c30" stroke="#30405e"/><g transform="translate(85 576) scale(0.95)" stroke="#9baaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="1" y="3" width="30" height="21" rx="3"/><path d="M16 24v6m-8 0h16"/></g><text x="137" y="603" font-size="28" fill="#f4f6ff" font-weight="500">Your Windows PC</text><rect x="64" y="647" width="512" height="68" rx="12" fill="#111c30" stroke="#30405e"/><g transform="translate(85 665) scale(0.95)" stroke="#9baaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="2" y="2" width="28" height="11" rx="3"/><rect x="2" y="19" width="28" height="11" rx="3"/><path d="M7 7.5h1m-1 17h1m7-17h10m-10 17h10"/></g><text x="137" y="692" font-size="28" fill="#f4f6ff" font-weight="500">Or a separate server</text><path d="M320 758V800" fill="none" stroke="#a4e9d2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="806" width="560" height="122" rx="20" fill="#151f33" stroke="#30405e"/><g transform="translate(72 843) scale(1.15)" stroke="#a4e9d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M2 9V5a3 3 0 0 1 3-3h8l5 5h9a3 3 0 0 1 3 3v17a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V9Z"/></g><text x="130" y="857" font-size="29" fill="#f4f6ff" font-weight="600">Your backups</text><text x="130" y="897" font-size="26" fill="#b9c7df" font-weight="400">Stored where you choose.</text><text x="40" y="991" font-size="29" fill="#f4f6ff" font-weight="600">The host must stay online.</text><text x="40" y="1036" font-size="26" fill="#b9c7df" font-weight="400">Account services and connection</text><text x="40" y="1072" font-size="26" fill="#b9c7df" font-weight="400">relays may still be involved.</text></g></svg>
