<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Tune the whole audio path</title><desc id="desc">Sound passes through microphone capture, processing and codec, network and hosting route, receive buffering and speaker playback. Relay offers hosting and audio controls. A 10 millisecond packet or buffer setting is not total microphone-to-speaker latency and does not prove an advantage over Discord.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m2 1 6 4-6 4" fill="none" stroke="#9baaff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1220"/><stop offset="1" stop-color="#17233c"/></linearGradient></defs>
<rect x=".5" y=".5" width="1199" height="559" rx="24" fill="url(#backdrop)" stroke="#30405e"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="56" y="49" font-size="17" fill="#a4e9d2" font-weight="600" letter-spacing="1.7">04 / TUNE THE WHOLE PATH</text><text x="56" y="112" font-size="44" fill="#f4f6ff" font-weight="650">Low ping is one part of a good call.</text><text x="56" y="157" font-size="24" fill="#b9c7df" font-weight="400">Choose where to host. See and adjust your audio settings.</text><rect x="56" y="228" width="200" height="150" rx="18" fill="#151f33" stroke="#30405e"/><g transform="translate(138 249) scale(1)" stroke="#9baaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="10" y="1" width="12" height="20" rx="6"/><path d="M4 14v3a12 12 0 0 0 24 0v-3M16 29v3m-6 0h12"/></g><text x="156" y="326" font-size="24" fill="#f4f6ff" font-weight="600" text-anchor="middle">Microphone</text><text x="156" y="359" font-size="20" fill="#b9c7df" font-weight="400" text-anchor="middle">Capture</text><path d="M260 299H271" fill="none" stroke="#9baaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="277" y="228" width="200" height="150" rx="18" fill="#151f33" stroke="#30405e"/><g transform="translate(359 249) scale(1)" stroke="#9baaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M2 14v5m7-11v17m7-23v29m7-23v17m7-11v5"/></g><text x="377" y="326" font-size="24" fill="#f4f6ff" font-weight="600" text-anchor="middle">Processing</text><text x="377" y="359" font-size="20" fill="#b9c7df" font-weight="400" text-anchor="middle">Noise + codec</text><path d="M481 299H492" fill="none" stroke="#9baaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="498" y="228" width="200" height="150" rx="18" fill="#1a2945" stroke="#51659e"/><g transform="translate(580 249) scale(1)" stroke="#a4e9d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="5" cy="7" r="4"/><circle cx="27" cy="25" r="4"/><path d="M9 7h12a6 6 0 0 1 0 12H11a6 6 0 0 0 0 12h8"/></g><text x="598" y="326" font-size="24" fill="#f4f6ff" font-weight="600" text-anchor="middle">Network</text><text x="598" y="359" font-size="20" fill="#b9c7df" font-weight="400" text-anchor="middle">Host + route</text><path d="M702 299H713" fill="none" stroke="#9baaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="719" y="228" width="200" height="150" rx="18" fill="#151f33" stroke="#30405e"/><g transform="translate(801 249) scale(1)" stroke="#9baaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M2 3h28M2 16h28M2 29h28"/><circle cx="9" cy="3" r="3" fill="#0c1220"/><circle cx="23" cy="16" r="3" fill="#0c1220"/><circle cx="14" cy="29" r="3" fill="#0c1220"/></g><text x="819" y="326" font-size="24" fill="#f4f6ff" font-weight="600" text-anchor="middle">Buffering</text><text x="819" y="359" font-size="20" fill="#b9c7df" font-weight="400" text-anchor="middle">Receive timing</text><path d="M923 299H934" fill="none" stroke="#9baaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="940" y="228" width="200" height="150" rx="18" fill="#151f33" stroke="#30405e"/><g transform="translate(1022 249) scale(1)" stroke="#9baaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M2 11h7L20 2v28L9 21H2Zm23-1a9 9 0 0 1 0 12m4-18a17 17 0 0 1 0 24"/></g><text x="1040" y="326" font-size="24" fill="#f4f6ff" font-weight="600" text-anchor="middle">Speaker</text><text x="1040" y="359" font-size="20" fill="#b9c7df" font-weight="400" text-anchor="middle">Playback</text><rect x="56" y="426" width="1088" height="82" rx="16" fill="#111b2d" stroke="#30405e"/><text x="80" y="476" font-size="25" fill="#f4f6ff" font-weight="500">10 ms is a packet / buffer setting — not the delay of the whole call.</text></g></svg>
