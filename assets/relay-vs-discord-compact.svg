tter-spacing="1">RELAY</text><text x="340" y="674" font-size="20" fill="#b9c7df" font-weight="600" letter-spacing="1">DISCORD</text><text x="64" y="721" font-size="27" fill="#f4f6ff" font-weight="600">Protected text</text><text x="64" y="757" font-size="27" fill="#f4f6ff" font-weight="600">by default.</text><text x="340" y="721" font-size="26" fill="#b9c7df" font-weight="400">No text</text><text x="340" y="757" font-size="26" fill="#b9c7df" font-weight="400">E2EE.</text><rect x="40" y="821" width="560" height="218" rx="20" fill="#111b2d" stroke="#30405e"/><text x="64" y="863" font-size="28" fill="#f4f6ff" font-weight="650">4K / 60 FPS settings</text><path d="M64 883H576" fill="none" stroke="#30405e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M317 905V1011" fill="none" stroke="#30405e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="922" font-size="20" fill="#a4e9d2" font-weight="650" letter-spacing="1">RELAY</text><text x="340" y="922" font-size="20" fill="#b9c7df" font-weight="600" letter-spacing="1">DISCORD</text><text x="64" y="969" font-size="27" fill="#f4f6ff" font-weight="600">Included.</text><text x="64" y="1005" font-size="27" fill="#f4f6ff" font-weight="600">No Relay sub.</text><text x="340" y="969" font-size="26" fill="#b9c7df" font-weight="400">4K/60 tier</text><text x="340" y="1005" font-size="26" fill="#b9c7df" font-weight="400">needs Nitro.</text><rect x="40" y="1069" width="560" height="218" rx="20" fill="#111b2d" stroke="#30405e"/><text x="64" y="1111" font-size="28" fill="#f4f6ff" font-weight="650">Audio + video E2EE</text><path d="M64 1131H576" fill="none" stroke="#30405e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M317 1153V1259" fill="none" stroke="#30405e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="1170" font-size="20" fill="#a4e9d2" font-weight="650" letter-spacing="1">RELAY</text><text x="340" y="1170" font-size="20" fill="#b9c7df" font-weight="600" letter-spacing="1">DISCORD</text><text x="64" y="1217" font-size="27" fill="#f4f6ff" font-weight="600">Yes, in</text><text x="64" y="1253" font-size="27" fill="#f4f6ff" font-weight="600">protected mode.</text><text x="340" y="1217" font-size="26" fill="#b9c7df" font-weight="400">Yes,</text><text x="340" y="1253" font-size="26" fill="#b9c7df" font-weight="400">using DAVE.</text><rect x="40" y="1317" width="560" height="218" rx="20" fill="#111b2d" stroke="#30405e"/><text x="64" y="1359" font-size="28" fill="#f4f6ff" font-weight="650">Host maintenance</text><path d="M64 1379H576" fill="none" stroke="#30405e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M317 1401V1507" fill="none" stroke="#30405e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="1418" font-size="20" fill="#a4e9d2" font-weight="650" letter-spacing="1">RELAY</text><text x="340" y="1418" font-size="20" fill="#b9c7df" font-weight="600" letter-spacing="1">DISCORD</text><text x="64" y="1465" font-size="27" fill="#f4f6ff" font-weight="600">You run and</text><text x="64" y="1501" font-size="27" fill="#f4f6ff" font-weight="600">back up the host.</text><text x="340" y="1465" font-size="26" fill="#b9c7df" font-weight="400">Discord manages</text><text x="340" y="1501" font-size="26" fill="#b9c7df" font-weight="400">hosting.</text><text x="40" y="1609" font-size="25" fill="#b9c7df" font-weight="400">Experimental Windows preview.</text><text x="40" y="1646" font-size="25" fill="#b9c7df" font-weight="400">Quality settings are not measured FPS.</text><text x="40" y="1683" font-size="25" fill="#b9c7df" font-weight="400">Full comparison and sources below.</text></g></svg>
