<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1730" viewBox="0 0 640 1730" role="img" aria-labelledby="title desc">
<title id="title">Relay vs Discord — mobile comparison</title><desc id="desc">Relay versus Discord: Relay lets you host the community backend, offers end-to-end encrypted text in recommended protected mode, and includes 4K/60 screen-sharing settings without a Relay subscription. Discord hosts the backend, does not end-to-end encrypt text, and documents 4K/60 as a Nitro feature. Both offer audio/video E2EE. Relay requires you to operate its host; Discord manages hosting. Relay is an experimental Windows preview. Quality settings are not a benchmark. Full sources are in COMPARISON.md.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m2 1 6 4-6 4" fill="none" stroke="#9baaff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1220"/><stop offset="1" stop-color="#17233c"/></linearGradient></defs>
<rect x=".5" y=".5" width="639" height="1729" rx="24" fill="url(#backdrop)" stroke="#30405e"/>
