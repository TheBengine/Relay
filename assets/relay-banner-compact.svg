<svg xmlns="http://www.w3.org/2000/svg" width="640" height="880" viewBox="0 0 640 880" role="img" aria-labelledby="title desc">
<title id="title">Relay — Your friends. Your server.</title><desc id="desc">Mobile layout: chat, voice and screen sharing on your own community server. Native Windows preview; end-to-end encryption is recommended by default.</desc>
