174" rx="22" fill="#1a2945" stroke="#51659e"/><g transform="translate(68 562) scale(0.625)"><rect width="64" height="64" rx="17" fill="#5865f2"/><circle cx="32" cy="32" r="17" stroke="white" stroke-width="4" fill="none"/><circle cx="44" cy="20" r="5" fill="white"/><circle cx="20" cy="44" r="5" fill="white"/></g><text x="126" y="592" font-size="32" fill="#f4f6ff" font-weight="650">Your community</text><text x="68" y="650" font-size="27" fill="#b9c7df" font-weight="400">Your PC or a separate server</text><rect x="40" y="746" width="190" height="38" rx="19" fill="#1c2944" stroke="#3a4c72"/><text x="135.0" y="771" font-size="23" fill="#9baaff" font-weight="600" text-anchor="middle">Self-hosted</text><rect x="244" y="746" width="288" height="38" rx="19" fill="#1c2944" stroke="#3a4c72"/><text x="388.0" y="771" font-size="23" fill="#9baaff" font-weight="600" text-anchor="middle">E2EE by default</text><text x="42" y="836" font-size="24" fill="#b9c7df" font-weight="400">Native Windows · Experimental preview</text></g></svg>
