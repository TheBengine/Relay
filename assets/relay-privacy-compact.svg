<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1160" viewBox="0 0 640 1160" role="img" aria-labelledby="title desc">
<title id="title">Your devices read. The server routes.</title><desc id="desc">With end-to-end encryption enabled, approved participant devices encrypt and decrypt content; the community server routes encrypted content and does not hold participant content keys. Transport encryption protects the connection separately. In open mode the server can read content. Metadata remains visible.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m2 1 6 4-6 4" fill="none" stroke="#9baaff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1220"/><stop offset="1" stop-color="#17233c"/></linearGradient></defs>
<rect x=".5" y=".5" width="639" height="1159" rx="24" fill="url(#backdrop)" stroke="#30405e"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="48" font-size="19" fill="#a4e9d2" font-weight="600" letter-spacing="1.3">02 / CHOOSE YOUR PRIVACY</text><text x="40" y="108" font-size="42" fill="#f4f6ff" font-weight="650">Your devices read.</text><text x="40" y="162" font-size="42" fill="#f4f6ff" font-weight="650">The server routes.</text><text x="40" y="222" font-size="27" fill="#b9c7df" font-weight="400">Recommended E2EE keeps keys</text><text x="40" y="259" font-size="27" fill="#b9c7df" font-weight="400">on approved participant devices.</text><rect x="40" y="315" width="560" height="162" rx="20" fill="#151f33" stroke="#30405e"/><text x="70" y="362" font-size="29" fill="#f4f6ff" font-weight="600">Encrypt on your PC</text><rect x="64" y="386" width="512" height="63" rx="12" fill="#233352" stroke="#3d507b"/><text x="88" y="427" font-size="28" fill="#f4f6ff" font-weight="400">Meet in Lounge?</text><rect x="40" y="759" width="560" height="162" rx="20" fill="#151f33" stroke="#30405e"/><text x="70" y="806" font-size="29" fill="#f4f6ff" font-weight="600">Decrypt on a friend&#x27;s PC</text><rect x="64" y="830" width="512" height="63" rx="12" fill="#233352" stroke="#3d507b"/><text x="88" y="871" font-size="28" fill="#f4f6ff" font-weight="400">Meet in Lounge?</text><path d="M320 477V527" fill="none" stroke="#9baaff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M320 699V749" fill="none" stroke="#9baaff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="537" width="560" height="162" rx="20" fill="#151f33" stroke="#30405e"/><g transform="translate(74 594) scale(1.3)" stroke="#9baaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="4" y="13" width="24" height="18" rx="4"/><path d="M9 13V8a7 7 0 0 1 14 0v5m-7 8v3"/></g><text x="144" y="589" font-size="30" fill="#f4f6ff" font-weight="600">Community server</text><text x="144" y="632" font-size="27" fill="#9baaff" font-weight="400">Routes encrypted content.</text><text x="144" y="672" font-size="24" fill="#b9c7df" font-weight="400">No participant content keys.</text><text x="40" y="978" font-size="27" fill="#a4e9d2" font-weight="400">Transport protects the connection.</text><text x="40" y="1018" font-size="27" fill="#a4e9d2" font-weight="400">E2EE protects content from the host.</text><text x="40" y="1081" font-size="25" fill="#b9c7df" font-weight="400">Open mode: the server can read content.</text><text x="40" y="1117" font-size="25" fill="#b9c7df" font-weight="400">Members, timing and sizes stay visible.</text></g></svg>
