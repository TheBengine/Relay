<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">The server routes. Your devices read.</title><desc id="desc">With end-to-end encryption enabled, approved participant devices encrypt and decrypt content; the community server routes encrypted content and does not hold participant content keys. Transport encryption protects the connection separately. In open mode the server can read content. Metadata remains visible.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m2 1 6 4-6 4" fill="none" stroke="#9baaff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1220"/><stop offset="1" stop-color="#17233c"/></linearGradient></defs>
<rect x=".5" y=".5" width="1199" height="689" rx="24" fill="url(#backdrop)" stroke="#30405e"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="56" y="49" font-size="17" fill="#a4e9d2" font-weight="600" letter-spacing="1.7">02 / CHOOSE YOUR PRIVACY</text><text x="56" y="112" font-size="44" fill="#f4f6ff" font-weight="650">The server routes. Your devices read.</text><text x="56" y="157" font-size="24" fill="#b9c7df" font-weight="400">With recommended end-to-end encryption and approved devices.</text><rect x="56" y="238" width="284" height="224" rx="20" fill="#151f33" stroke="#30405e"/><text x="80" y="285" font-size="23" fill="#f4f6ff" font-weight="600">Encrypt on your PC</text><rect x="78" y="315" width="240" height="76" rx="14" fill="#233352" stroke="#3d507b"/><text x="98" y="362" font-size="23" fill="#f4f6ff" font-weight="400">Meet in Lounge?</text><text x="80" y="433" font-size="21" fill="#a4e9d2" font-weight="400">Content keys stay here</text><rect x="860" y="238" width="284" height="224" rx="20" fill="#151f33" stroke="#30405e"/><text x="884" y="285" font-size="23" fill="#f4f6ff" font-weight="600">Decrypt on a friend&#x27;s PC</text><rect x="882" y="315" width="240" height="76" rx="14" fill="#233352" stroke="#3d507b"/><text x="902" y="362" font-size="23" fill="#f4f6ff" font-weight="400">Meet in Lounge?</text><text x="884" y="433" font-size="21" fill="#a4e9d2" font-weight="400">Content keys stay here</text><path d="M342 350H452" fill="none" stroke="#9baaff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M744 350H854" fill="none" stroke="#9baaff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="458" y="238" width="284" height="224" rx="20" fill="#151f33" stroke="#30405e"/><text x="600" y="285" font-size="24" fill="#f4f6ff" font-weight="600" text-anchor="middle">Community server</text><g transform="translate(580 320) scale(1.25)" stroke="#9baaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="4" y="13" width="24" height="18" rx="4"/><path d="M9 13V8a7 7 0 0 1 14 0v5m-7 8v3"/></g><text x="600" y="399" font-size="23" fill="#9baaff" font-weight="600" text-anchor="middle">Encrypted content</text><text x="600" y="435" font-size="18" fill="#b9c7df" font-weight="400" text-anchor="middle">No participant content keys</text><rect x="56" y="508" width="1088" height="93" rx="16" fill="#111b2d" stroke="#30405e"/><text x="80" y="545" font-size="16" fill="#9baaff" font-weight="600" letter-spacing="1.2">TRANSPORT</text><text x="80" y="578" font-size="23" fill="#f4f6ff" font-weight="400">Protects the connection.</text><path d="M568 528V581" fill="none" stroke="#30405e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="598" y="545" font-size="16" fill="#a4e9d2" font-weight="600" letter-spacing="1.2">END-TO-END ENCRYPTION</text><text x="598" y="578" font-size="23" fill="#f4f6ff" font-weight="400">Protects content from the host.</text><text x="56" y="647" font-size="22" fill="#b9c7df" font-weight="400">Open mode lets the server read content. Membership, sizes and timing remain visible.</text></g></svg>
