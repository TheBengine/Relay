<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc">
<title id="title">Relay vs Discord — more control, private text and included quality controls</title><desc id="desc">Relay versus Discord: Relay lets you host the community backend, offers end-to-end encrypted text in recommended protected mode, and includes 4K/60 screen-sharing settings without a Relay subscription. Discord hosts the backend, does not end-to-end encrypt text, and documents 4K/60 as a Nitro feature. Both offer audio/video E2EE. Relay requires you to operate its host; Discord manages hosting. Relay is an experimental Windows preview. Quality settings are not a benchmark. Full sources are in COMPARISON.md.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m2 1 6 4-6 4" fill="none" stroke="#9baaff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1220"/><stop offset="1" stop-color="#17233c"/></linearGradient></defs>
<rect x=".5" y=".5" width="1199" height="929" rx="24" fill="url(#backdrop)" stroke="#30405e"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="56" y="49" font-size="17" fill="#a4e9d2" font-weight="600" letter-spacing="1.2">RELAY vs DISCORD / CHECKED 21 OCT 2026</text><text x="56" y="112" font-size="49" fill="#f4f6ff" font-weight="700">More control than Discord.</text><text x="56" y="161" font-size="25" fill="#b9c7df" font-weight="400">Your host. Private text. Quality controls without a Relay subscription.</text><rect x="56" y="208" width="1088" height="636" rx="22" fill="#111b2d" stroke="#30405e"/><rect x="366" y="209" width="390" height="634" rx="0" fill="#1b2b48" stroke="#1b2b48"/><text x="80" y="259" font-size="18" fill="#b9c7df" font-weight="600" letter-spacing="1.1">WHAT YOU GET</text><g transform="translate(392 229) scale(0.625)"><rect width="64" height="64" rx="17" fill="#5865f2"/><circle cx="32" cy="32" r="17" stroke="white" stroke-width="4" fill="none"/><circle cx="44" cy="20" r="5" fill="white"/><circle cx="20" cy="44" r="5" fill="white"/></g><text x="449" y="261" font-size="32" fill="#f4f6ff" font-weight="650">Relay</text><text x="799" y="261" font-size="32" fill="#b9c7df" font-weight="650">Discord</text><path d="M80 286H1120" fill="none" stroke="#30405e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="329" font-size="23" fill="#f4f6ff" font-weight="500">Host the actual</text><text x="80" y="361" font-size="23" fill="#f4f6ff" font-weight="500">community backend</text><g transform="translate(390 309) scale(0.65)" stroke="#a4e9d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="m4 16 8 8L28 7"/></g><text x="421" y="328" font-size="24" fill="#f4f6ff" font-weight="650">Your hardware</text><text x="390" y="366" font-size="21" fill="#a4e9d2" font-weight="400">You choose the server location</text><text x="799" y="328" font-size="24" fill="#f4f6ff" font-weight="500">Discord&#x27;s infrastructure</text><text x="799" y="366" font-size="20" fill="#b9c7df" font-weight="400">Hosting managed by Discord</text><path d="M80 396H1120" fill="none" stroke="#30405e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="439" font-size="23" fill="#f4f6ff" font-weight="500">Text message</text><text x="80" y="471" font-size="23" fill="#f4f6ff" font-weight="500">end-to-end encryption</text><g transform="translate(390 419) scale(0.65)" stroke="#a4e9d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="m4 16 8 8L28 7"/></g><text x="421" y="438" font-size="24" fill="#f4f6ff" font-weight="650">Included in protected mode</text><text x="390" y="476" font-size="21" fill="#a4e9d2" font-weight="400">Recommended by default</text><text x="799" y="438" font-size="24" fill="#f4f6ff" font-weight="500">No text E2EE</text><text x="799" y="476" font-size="20" fill="#b9c7df" font-weight="400">Transport + at-rest encryption</text><path d="M80 506H1120" fill="none" stroke="#30405e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="549" font-size="23" fill="#f4f6ff" font-weight="500">4K / 60 FPS</text><text x="80" y="581" font-size="23" fill="#f4f6ff" font-weight="500">screen-sharing settings</text><g transform="translate(390 529) scale(0.65)" stroke="#a4e9d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="m4 16 8 8L28 7"/></g><text x="421" y="548" font-size="24" fill="#f4f6ff" font-weight="650">Included in Relay</text><text x="390" y="586" font-size="21" fill="#a4e9d2" font-weight="400">No Relay subscription required</text><text x="799" y="548" font-size="24" fill="#f4f6ff" font-weight="500">Nitro feature</text><text x="799" y="586" font-size="20" fill="#b9c7df" font-weight="400">Discord&#x27;s documented 4K/60 tier</text><path d="M80 616H1120" fill="none" stroke="#30405e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="659" font-size="23" fill="#f4f6ff" font-weight="500">Audio + video</text><text x="80" y="691" font-size="23" fill="#f4f6ff" font-weight="500">end-to-end encryption</text><text x="390" y="658" font-size="24" fill="#f4f6ff" font-weight="600">Yes, in protected mode</text><text x="390" y="696" font-size="21" fill="#a4e9d2" font-weight="400">Approved devices hold keys</text><text x="799" y="658" font-size="24" fill="#f4f6ff" font-weight="500">Yes, using DAVE</text><text x="799" y="696" font-size="20" fill="#b9c7df" font-weight="400">Also available on Discord</text><path d="M80 726H1120" fill="none" stroke="#30405e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="769" font-size="23" fill="#f4f6ff" font-weight="500">Host maintenance</text><text x="80" y="801" font-size="23" fill="#f4f6ff" font-weight="500">and availability</text><text x="390" y="768" font-size="24" fill="#f4f6ff" font-weight="600">You manage the host</text><text x="390" y="806" font-size="21" fill="#a4e9d2" font-weight="400">Keep it online and backed up</text><text x="799" y="768" font-size="24" fill="#f4f6ff" font-weight="500">Discord manages hosting</text><text x="799" y="806" font-size="20" fill="#b9c7df" font-weight="400">No community host to maintain</text><text x="56" y="891" font-size="22" fill="#b9c7df" font-weight="400">Experimental Windows preview. Quality settings are not sustained-FPS measurements.</text></g></svg>
