<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1100" viewBox="0 0 640 1100" role="img" aria-labelledby="title desc">
<title id="title">More than a low ping</title><desc id="desc">Sound passes through microphone capture, processing and codec, network and hosting route, receive buffering and speaker playback. Relay offers hosting and audio controls. A 10 millisecond packet or buffer setting is not total microphone-to-speaker latency and does not prove an advantage over Discord.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m2 1 6 4-6 4" fill="none" stroke="#9baaff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1220"/><stop offset="1" stop-color="#17233c"/></linearGradient></defs>
<rect x=".5" y=".5" width="639" height="1099" rx="24" fill="url(#backdrop)" stroke="#30405e"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="48" font-size="19" fill="#a4e9d2" font-weight="600" letter-spacing="1.3">04 / TUNE THE WHOLE PATH</text><text x="40" y="108" font-size="42" fill="#f4f6ff" font-weight="650">More than</text><text x="40" y="162" font-size="42" fill="#f4f6ff" font-weight="650">a low ping.</text><text x="40" y="222" font-size="27" fill="#b9c7df" font-weight="400">Choose your host and tune</text><text x="40" y="259" font-size="27" fill="#b9c7df" font-weight="400">your audio settings.</text><rect x="40" y="315" width="560" height="91" rx="16" fill="#151f33" stroke="#30405e"/><g transform="translate(71 344) scale(1.1)" stroke="#9baaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="10" y="1" width="12" height="20" rx="6"/><path d="M4 14v3a12 12 0 0 0 24 0v-3M16 29v3m-6 0h12"/></g><text x="137" y="356" font-size="28" fill="#f4f6ff" font-weight="600">Microphone</text><text x="137" y="388" font-size="25" fill="#b9c7df" font-weight="400">Capture</text><path d="M320 409V430" fill="none" stroke="#9baaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="436" width="560" height="91" rx="16" fill="#151f33" stroke="#30405e"/><g transform="translate(71 465) scale(1.1)" stroke="#9baaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M2 14v5m7-11v17m7-23v29m7-23v17m7-11v5"/></g><text x="137" y="477" font-size="28" fill="#f4f6ff" font-weight="600">Processing</text><text x="137" y="509" font-size="25" fill="#b9c7df" font-weight="400">Noise + codec</text><path d="M320 530V551" fill="none" stroke="#9baaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="557" width="560" height="91" rx="16" fill="#1a2945" stroke="#51659e"/><g transform="translate(71 586) scale(1.1)" stroke="#a4e9d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="5" cy="7" r="4"/><circle cx="27" cy="25" r="4"/><path d="M9 7h12a6 6 0 0 1 0 12H11a6 6 0 0 0 0 12h8"/></g><text x="137" y="598" font-size="28" fill="#f4f6ff" font-weight="600">Network</text><text x="137" y="630" font-size="25" fill="#b9c7df" font-weight="400">Host + route</text><path d="M320 651V672" fill="none" stroke="#9baaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="678" width="560" height="91" rx="16" fill="#151f33" stroke="#30405e"/><g transform="translate(71 707) scale(1.1)" stroke="#9baaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M2 3h28M2 16h28M2 29h28"/><circle cx="9" cy="3" r="3" fill="#0c1220"/><circle cx="23" cy="16" r="3" fill="#0c1220"/><circle cx="14" cy="29" r="3" fill="#0c1220"/></g><text x="137" y="719" font-size="28" fill="#f4f6ff" font-weight="600">Buffering</text><text x="137" y="751" font-size="25" fill="#b9c7df" font-weight="400">Receive timing</text><path d="M320 772V793" fill="none" stroke="#9baaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="799" width="560" height="91" rx="16" fill="#151f33" stroke="#30405e"/><g transform="translate(71 828) scale(1.1)" stroke="#9baaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M2 11h7L20 2v28L9 21H2Zm23-1a9 9 0 0 1 0 12m4-18a17 17 0 0 1 0 24"/></g><text x="137" y="840" font-size="28" fill="#f4f6ff" font-weight="600">Speaker</text><text x="137" y="872" font-size="25" fill="#b9c7df" font-weight="400">Playback</text><rect x="40" y="938" width="560" height="125" rx="16" fill="#111b2d" stroke="#30405e"/><text x="64" y="981" font-size="26" fill="#f4f6ff" font-weight="400">10 ms is a packet / buffer setting.</text><text x="64" y="1019" font-size="26" fill="#f4f6ff" font-weight="400">It is not the delay of the whole call.</text></g></svg>
