<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1120" viewBox="0 0 640 1120" role="img" aria-labelledby="title desc">
<title id="title">An invitation. Your community.</title><desc id="desc">The host shares an invitation. With an HTTPS invitation and Relay installed, the browser asks before opening the app. The friend confirms the invitation and creates or uses a community account. iroh does not require a separate networking account. Pasting the invitation in Join friends is a fallback.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m2 1 6 4-6 4" fill="none" stroke="#9baaff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1220"/><stop offset="1" stop-color="#17233c"/></linearGradient></defs>
<rect x=".5" y=".5" width="639" height="1119" rx="24" fill="url(#backdrop)" stroke="#30405e"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="48" font-size="19" fill="#a4e9d2" font-weight="600" letter-spacing="1.3">03 / BRING YOUR FRIENDS</text><text x="40" y="108" font-size="42" fill="#f4f6ff" font-weight="650">An invitation.</text><text x="40" y="162" font-size="42" fill="#f4f6ff" font-weight="650">Your community.</text><text x="40" y="222" font-size="27" fill="#b9c7df" font-weight="400">With an HTTPS invitation</text><text x="40" y="259" font-size="27" fill="#b9c7df" font-weight="400">and Relay installed.</text><rect x="40" y="315" width="560" height="184" rx="20" fill="#151f33" stroke="#30405e"/><g transform="translate(70 343) scale(1.05)" stroke="#a4e9d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="m12 20 8-8M10 23l-2 2a6 6 0 0 1-8-8l8-8a6 6 0 0 1 8 0m6 0 2-2a6 6 0 0 1 8 8l-8 8a6 6 0 0 1-8 0" transform="translate(1 0) scale(.92)"/></g><text x="570" y="362" font-size="21" fill="#b9c7df" font-weight="600" text-anchor="end">01</text><text x="124" y="364" font-size="29" fill="#f4f6ff" font-weight="600">Send your invitation</text><text x="72" y="421" font-size="27" fill="#b9c7df" font-weight="400">Invite friends →</text><text x="72" y="459" font-size="27" fill="#b9c7df" font-weight="400">Share and copy invitation</text><path d="M320 499V538" fill="none" stroke="#9baaff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="549" width="560" height="184" rx="20" fill="#151f33" stroke="#30405e"/><g transform="translate(70 577) scale(1.05)" stroke="#a4e9d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="1" y="2" width="30" height="28" rx="4"/><path d="M1 10h30M6 6h1m4 0h1m4 0h1M12 17l7 4-7 4Z"/></g><text x="570" y="596" font-size="21" fill="#b9c7df" font-weight="600" text-anchor="end">02</text><text x="124" y="598" font-size="29" fill="#f4f6ff" font-weight="600">Open Relay</text><text x="72" y="655" font-size="27" fill="#b9c7df" font-weight="400">Browser asks before</text><text x="72" y="693" font-size="27" fill="#b9c7df" font-weight="400">opening the installed app.</text><path d="M320 733V772" fill="none" stroke="#9baaff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="783" width="560" height="184" rx="20" fill="#151f33" stroke="#30405e"/><g transform="translate(70 811) scale(1.05)" stroke="#a4e9d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M3 2h26v21H14l-9 7v-7H3Z"/><path d="M9 9h14M9 15h10"/></g><text x="570" y="830" font-size="21" fill="#b9c7df" font-weight="600" text-anchor="end">03</text><text x="124" y="832" font-size="29" fill="#f4f6ff" font-weight="600">Join the community</text><text x="72" y="889" font-size="27" fill="#b9c7df" font-weight="400">Confirm the invitation and</text><text x="72" y="927" font-size="27" fill="#b9c7df" font-weight="400">create or use your account.</text><text x="40" y="1036" font-size="26" fill="#b9c7df" font-weight="400">No separate VPN account with iroh.</text><text x="40" y="1078" font-size="26" fill="#b9c7df" font-weight="400">Or paste the invitation in Join friends.</text></g></svg>
