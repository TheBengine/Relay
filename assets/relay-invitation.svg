<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">An invitation, a browser, your community</title><desc id="desc">The host shares an invitation. With an HTTPS invitation and Relay installed, the browser asks before opening the app. The friend confirms the invitation and creates or uses a community account. iroh does not require a separate networking account. Pasting the invitation in Join friends is a fallback.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m2 1 6 4-6 4" fill="none" stroke="#9baaff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1220"/><stop offset="1" stop-color="#17233c"/></linearGradient></defs>
<rect x=".5" y=".5" width="1199" height="609" rx="24" fill="url(#backdrop)" stroke="#30405e"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="56" y="49" font-size="17" fill="#a4e9d2" font-weight="600" letter-spacing="1.7">03 / BRING YOUR FRIENDS</text><text x="56" y="112" font-size="44" fill="#f4f6ff" font-weight="650">Invite a friend. Keep the setup simple.</text><text x="56" y="157" font-size="24" fill="#b9c7df" font-weight="400">An HTTPS invitation takes them from the browser into Relay.</text><rect x="56" y="222" width="330" height="228" rx="20" fill="#151f33" stroke="#30405e"/><text x="352" y="260" font-size="18" fill="#b9c7df" font-weight="600" text-anchor="end">01</text><g transform="translate(82 248) scale(1.1)" stroke="#a4e9d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="m12 20 8-8M10 23l-2 2a6 6 0 0 1-8-8l8-8a6 6 0 0 1 8 0m6 0 2-2a6 6 0 0 1 8 8l-8 8a6 6 0 0 1-8 0" transform="translate(1 0) scale(.92)"/></g><text x="82" y="337" font-size="26" fill="#f4f6ff" font-weight="600">Send your invitation</text><text x="82" y="380" font-size="21" fill="#b9c7df" font-weight="400">Invite friends →</text><text x="82" y="413" font-size="21" fill="#b9c7df" font-weight="400">Share and copy invitation</text><path d="M396 335H425" fill="none" stroke="#9baaff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="435" y="222" width="330" height="228" rx="20" fill="#151f33" stroke="#30405e"/><text x="731" y="260" font-size="18" fill="#b9c7df" font-weight="600" text-anchor="end">02</text><g transform="translate(461 248) scale(1.1)" stroke="#a4e9d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="1" y="2" width="30" height="28" rx="4"/><path d="M1 10h30M6 6h1m4 0h1m4 0h1M12 17l7 4-7 4Z"/></g><text x="461" y="337" font-size="26" fill="#f4f6ff" font-weight="600">Open Relay</text><text x="461" y="380" font-size="21" fill="#b9c7df" font-weight="400">Browser asks before</text><text x="461" y="413" font-size="21" fill="#b9c7df" font-weight="400">opening the installed app.</text><path d="M775 335H804" fill="none" stroke="#9baaff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="814" y="222" width="330" height="228" rx="20" fill="#151f33" stroke="#30405e"/><text x="1110" y="260" font-size="18" fill="#b9c7df" font-weight="600" text-anchor="end">03</text><g transform="translate(840 248) scale(1.1)" stroke="#a4e9d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M3 2h26v21H14l-9 7v-7H3Z"/><path d="M9 9h14M9 15h10"/></g><text x="840" y="337" font-size="26" fill="#f4f6ff" font-weight="600">Join the community</text><text x="840" y="380" font-size="21" fill="#b9c7df" font-weight="400">Confirm the invitation and</text><text x="840" y="413" font-size="21" fill="#b9c7df" font-weight="400">create or use your account.</text><text x="56" y="517" font-size="25" fill="#f4f6ff" font-weight="600">iroh can connect without a separate VPN account for each friend.</text><text x="56" y="560" font-size="23" fill="#b9c7df" font-weight="400">App didn&#x27;t open? Paste the invitation in Join friends.</text></g></svg>
