[package]
name = "relay-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# QA only: owned loopback HTTP identity/Friends service. Never in a release.
qa-loopback-identity = []

[dependencies]
relay-protocol = { path = "../relay-protocol" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
hmac = "0.12"
subtle = "2"
zeroize = { version = "1", features = ["serde"] }
ed25519-dalek = "=2.2.0"
hpke-rs = { version = "=0.7.0", features = ["std", "rustcrypto"] }
totp-rs = { version = "=6.0.0", features = ["otpauth", "zeroize"] }
openidconnect = { version = "=4.0.1", default-features = false, features = ["reqwest"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
serenity = { version = "=0.12.5", default-features = false, features = ["builder", "client", "gateway", "http", "model", "rustls_backend"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
socket2 = { version = "=0.6.5", features = ["all"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
relay-crypto = { path = "../relay-crypto" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
