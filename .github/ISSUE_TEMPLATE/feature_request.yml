name: Feature suggestion
description: Suggest an improvement to Relay.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the user need or inconvenience.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Explain the behavior you would like, with an example if useful.
    validations:
      required: true
